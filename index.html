<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5b7cfa" />
    <script>
      /* 防闪烁：React 挂载前先落 data-theme，否则深色/风格主题用户刷新会先闪浅色。
         themeColor 映射与 src/theme.ts THEMES 保持同步（有意复制，内联脚本读不到模块） */
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('pocket-ledger') || '{}');
          var t = saved && saved.state && saved.state.theme;
          var known = ['light', 'dark', 'candy', 'sakura', 'journal'];
          if (known.indexOf(t) === -1) t = 'light';
          document.documentElement.dataset.theme = t;
          var colors = { light: '#5b7cfa', dark: '#12151c', candy: '#ff7096', sakura: '#d98cc0', journal: '#a97c50' };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', colors[t]);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="口袋记账：多账本、资产管理、收支统计图表，移动端优先的响应式记账本" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="口袋记账" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <title>口袋记账 · PocketLedger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
